services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/qa-use
      - INNGEST_DEV=1
      - INNGEST_BASE_URL=http://inngest:8288
      - BROWSER_WS_ENDPOINT=ws://browser:4444
      - BROWSER_DEVTOOLS_WS=ws://browser:9222
      - NEXT_PUBLIC_LIVE_PREVIEW_URL=http://localhost:7900/?resize=scale&autoconnect=1&view_only=0
      - HEADLESS=${HEADLESS:-false}
      - VIDEO=${VIDEO:-false}
      - MAX_AGENT_STEPS=${MAX_AGENT_STEPS:-30}
      - IGNORE_HTTPS_ERRORS=${IGNORE_HTTPS_ERRORS:-true}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      browser:
        condition: service_started
    networks:
      - qause-network
    volumes:
      - ./public/evidences:/app/public/evidences

  browser:
    image: seleniarm/standalone-chromium:latest
    shm_size: 2gb
    environment:
      - SE_ENABLE_VNC=true
      - SE_VNC_NO_PASSWORD=1
      - SE_NODE_MAX_SESSIONS=1
      - SCREEN_WIDTH=1280
      - SCREEN_HEIGHT=900
    ports:
      - "7900:7900"
      - "9222:9222"
    networks:
      - qause-network
    entrypoint: ["bash", "-lc", "chromium-browser --remote-debugging-address=0.0.0.0 --remote-debugging-port=9222 --disable-dev-shm-usage --disable-gpu --no-sandbox --user-data-dir=/home/seluser/chrome-data & /opt/bin/entry_point.sh"]


  inngest:
    image: inngest/inngest
    command: 'inngest dev -u http://app:3000/api/inngest'
    ports:
      - '8288:8288'
    depends_on:
      - app
    networks:
      - qause-network

  postgres:
    restart: always
    image: postgres:15
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=qa-use
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    command: postgres -c max_connections=1000
    networks:
      - qause-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm drizzle-kit migrate --config ./drizzle.config.ts
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/qa-use
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - qause-network

networks:
  qause-network:
    driver: bridge
